derivation: >-
  Entities are the schemas returned as the application/json 200 body of a GET on a collection or item
  path. Relationships are read from typed href references (AccountHref, ClusterHref, AddressSetHref,
  FileHref, ProviderResourceHref) and from path containment — a nested path such as
  /accounts/{id}/roles is a belongs_to from the child to the parent. No relationship here is inferred
  from prose.

identity:
  id_style: opaque string in a path segment, e.g. /v2/applications/xyz
  id_prefixes: none published
  self_link: every addressable resource carries an `href` attribute holding its own URI
  note: >-
    Webscale does not publish typed id prefixes (no app_, clu_, sec_ convention), so an identifier
    read out of context cannot be resolved to its collection without knowing where it came from.

