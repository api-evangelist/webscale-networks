aid: webscale-networks
name: Webscale Networks
description: >-
  Webscale Networks is a commerce infrastructure and application delivery company that runs managed AWS cloud hosting,
  CDN, WAF and edge traffic control for Adobe Commerce, Magento, Shopware, WooCommerce and headless storefronts, layered
  with an agentic AI product line (Agentic Commerce OS) covering a customer data platform, AI segmentation and an AI
  shopping assistant. It absorbed edge-computing company Section.io in 2023 and the MageMojo/Stratus hosting business,
  and exposes the whole platform through the Webscale APIs — a RESTful v2 control-plane API covering applications, web
  controls, clusters, environments, servers, monitors, logs, metrics, files, secrets, tasks, SSH hosts, accounts, users,
  roles and access keys — documented with a public OpenAPI 3.0.3 description served from its own control console.
image: https://www.webscale.com/wp-content/uploads/2025/05/ws-logo.svg
url: https://raw.githubusercontent.com/api-evangelist/webscale-networks/refs/heads/main/apis.yml
x-harvest:
  type: company
  source: secondary-market
  venues:
  - equityzen
  - nasdaq
specificationVersion: '0.20'
created: '2026-09-04'
modified: '2026-09-04'
tags:
- E-Commerce
