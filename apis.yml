apis:
- name: Webscale APIs
  description: >-
    The Webscale v2 control-plane REST API. 151 operations across 25 resource collections — applications and web
    controls, address sets, URL maps, clusters, environments and stacks, servers, builders, monitors, metric prototypes,
    application and SSH logs, archived logs, files and file versions, secrets, tasks, templates, accounts, groups,
    roles, invitations, users, service users, SSH hosts and access keys. JSON over HTTPS with GET/POST/PATCH/DELETE
    semantics, href-addressable resources, an EBNF filter expression language, and offset pagination.
  humanURL: https://control.webscale.com/docs/api
  baseURL: https://api.webscale.com/v2
