name: Webscale Networks published packages
official_count: 8
sdk_count: 1
note: >-
  Webscale publishes no first-party SDK for the Webscale v2 REST API in any language. What it does
  publish, and maintains actively, is a family of Magento 2 / Adobe Commerce and Shopware server-side
  extensions on Packagist under the `webscale-networks` vendor that integrate a merchant's storefront
  with the Webscale platform — cache/Varnish control and event streaming. These are first-party
  (vendor namespace matches the GitHub org github.com/webscale-networks) and current: five of the
  seven Packagist packages shipped a release in 2026. The only registry-published REST client ever
  produced for this platform is the Section-era Go SDK, which is archived and eight years stale.

