problem_types: []

finding: >-
  This is an honest empty catalog, not a missing one. The Webscale APIs OpenAPI declares a reusable
  `Error` schema in components.schemas but never references it from an operation response, and not one
  of the 151 operations declares a single 4xx or 5xx response. Every documented outcome is a success
  code. There is therefore nothing in the contract to derive problem types from, and the public docs
  publish no error-code reference page to search. Anything listed here beyond the envelope shape would
  be invented.

