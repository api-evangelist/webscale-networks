  control_probe_finding: >-
    Every path under /v2 returns 401 to an unauthenticated caller whether or not the path exists — a
    nonsense path and a real one are byte-identical. This is a deliberate and defensible posture (it
    does not leak which endpoints exist), but it means a 401 from this API carries NO information
    about whether the resource is real. Recorded here so a later pass does not read a 401 on a guessed
    path as evidence that the surface exists.

  runtime_envelope_diverges_from_contract:
    severity: notable
    documented_shape:
      schema: components.schemas.Error
      example: '{ "type": "...", "description": "..." }'
      fields_required: [type, description]
    observed_shape:
      example: '{ "status": 401, "error": { "type": "unauthorized", "message": "Your request must include an authorizationheader including a bearer token" } }'
      fields: [status, error.type, error.message]
    finding: >-
      THE LIVE API DOES NOT RETURN THE ERROR SHAPE THE CONTRACT DESCRIBES. The published `Error`
      schema is a flat object of {type, description}. The running service at
      https://api.webscale.com/v2 returns a nested envelope of {status, error:{type, message}} —
      an extra numeric `status` field, the error nested one level down, and `message` where the
      schema says `description`. A client written against the published schema would read
      `description` and get undefined on every error. Observed identically on four separate probes
      (GET and POST, real and nonsense paths).
    observed_type_value: unauthorized
    note_on_types: >-
      `unauthorized` is the first real `type` value observed for this API. It is recorded as an
      observation, not as a published enumeration — Webscale documents no error-type list.

