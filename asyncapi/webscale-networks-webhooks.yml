finding: >-
  Webscale's event surface is real but thin and pull-oriented. There is exactly ONE outbound webhook in
  the entire 613KB contract — a cluster-scoped `servers_update_webhook` — and it is a configuration
  field on a cluster rather than a subscribable event catalog. Everything else is pull: the Events
  viewer in the console (event title, timestamp, subject, type, severity, user, remote IP, searchable
  over 5min/1hr/3hr/6hr/24hr windows), application logs via GET /v2/applications/{id}/logs, SSH logs
  via GET /v2/ssh-hosts/{id}/logs, task logs via GET /v2/tasks/{id}/logs, and archived log download
  via GET /v2/archived-logs/{ref}.

