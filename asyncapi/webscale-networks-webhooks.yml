    No AsyncAPI document exists. NOT FABRICATED — a one-webhook surface with no declared payload
    schema, no signing and no event catalog does not support an honest AsyncAPI derivation, and
    authoring one would assert a channel contract Webscale has not published.

eventstream_product:
  note: >-
    DISAMBIGUATION. Webscale ships Magento and Shopware plugins named "EventStream"
    (webscale-networks/magento-eventstream 1.1.1, webscale-networks/shopware-eventstream 1.0.0 — see
    packages/). These stream a MERCHANT'S storefront events from their store into the Webscale
    platform. They are not a public event API that Webscale exposes to consumers, and no broker
    endpoint, topic namespace or message schema for them is published.

events_collection_gap:
  finding: >-
    The OpenAPI info.description advertises "/v2/events | Event | A record of an event related to the
    operation of the service or site" as one of the commonly used object types, and the document
    declares an `Events` tag — but NO /events path exists in the contract and no operation carries the
    Events tag. The events surface is documented in prose and reachable in the console, yet is absent
    from the machine-readable contract.

