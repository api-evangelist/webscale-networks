openapi: 3.2.0
info:
  title: Webscale Applications API
  version: '2026.273'
  description: The Webscale APIs allow programmatic access to the Webscale services.
servers:
- url: https://api.webscale.com/v2
security:
- access_key: []
tags:
- name: Applications
  x-tag-expanded: false
  description: 'An application configures the Webscale service for a group of related

    websites.'
paths:
  /applications:
    get:
      summary: Read application collection
      description: Will return all the application resources that the caller is authorized to view.
      tags:
      - Applications
      responses:
        '200':
          description: The call was successful.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Application'
      operationId: getApplications
      x-operation-id-source: derived
    post:
      summary: Create an application
      description: ''
      parameters: []
      tags:
      - Applications
      responses:
        '200':
          description: The application was successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPost'
              description: The application definition.
      operationId: postApplications
      x-operation-id-source: derived
  /applications/{id}:
    get:
      summary: Read an application
      description: Retrieve an application resource.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Application id.
      tags:
      - Applications
      responses:
        '200':
          description: The application was successfully retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
      operationId: getApplicationsById
      x-operation-id-source: derived
    patch:
      summary: Update an application
      description: ''
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Application id.
      tags:
      - Applications
      responses:
        '200':
          description: The application was successfully updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '201':
          description: A task was created to patch the application.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplicationPatch'
              description: The application definition.
      operationId: patchApplicationsById
      x-operation-id-source: derived
    delete:
      summary: Delete an application
      description: An application must be in the stopped state to be deleted.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Application id.
      tags:
      - Applications
      responses:
        '200':
          description: The call application was successfully deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
      operationId: deleteApplicationsById
      x-operation-id-source: derived
  /applications/metrics:
    get:
      summary: Read application collection metrics
      description: Returns requested metrics for all applications.
      tags:
      - Applications
      parameters:
      - name: names
        in: query
        required: true
        description: A comma separated list of metrics names. For the set of metrics supported, see [GET applications/{id}/authorization](#get-/applications/-id-/metrics)
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/from'
        schema: {}
      - $ref: '#/components/parameters/to'
        schema: {}
      - $ref: '#/components/parameters/resolution'
        schema: {}
      - $ref: '#/components/parameters/summarize'
        schema: {}
      responses:
        '200':
          description: Metrics for the applications are returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
      operationId: getApplicationsMetrics
      x-operation-id-source: derived
  /applications/{id}/metrics:
    get:
      summary: Read application metrics
      description: 'Read named metrics for an application. A time period specified by `from` and

        `to` query parameters is required. A `resolution` parameter optionally

        specifies the size of the intervals in which metrics are returned. The

        metrics available are:


        ### active_requests


        Average request count being serviced by application servers at any instant.


        ### active_sessions


        Average of the number of sessions active at any instant. A session is active

        from its first request until it times out at 30 minutes after its last

        request.


        ### bytes_in


        The number of input bytes received by a data plane for requests.


        ### bytes_out


        The number of output bytes written by a data plane in responses.


        ### cdn_bytes_in


        The number of input bytes received by a CDN for requests.


        ### cdn_bytes_out


        The number of output bytes written by a CDN in responses.


        ### countries


        An object mapping a country code to a count of requests.


        ### delivery_status


        An object mapping a delivery status to a count of requests.


        ### edge_locations


        An object mapping an CDN POP location to a count of requests.


        ### edge_response_time


        The average elapsed time as measured at CDN POPs.


        ### edge_response_types


        An object mapping a CDN response type to a count of requests.


        ### edge_status_codes


        An object mapping response status codes to a count of requests as observed

        at CDN POPs.


        ### edge_ttfb


        The average time to first byte (TTFB) for responses as observed at CDN POPs.


        ### edge_useragent_device


        An object mapping a user agent device code to a count of requests as

        observed at CDN POPs.


        ### edge_useragent_name


        An object mapping a user agent name to a count of requests as

        observed at CDN POPs.


        ### edge_useragent_os


        An object mapping a user agent operating system code to a count of requests

        as observed at CDN POPs.


        ### page_load_elapsed


        Average page load time as reported by a user agent.


        ### page_views


        Count of page load reports made by user agents.


        ### rejected_requests


        Count of requests that were rejected because the application servers were

        not responsive and either too many requests were queued or a request was

        queued for too long.


        ### requests


        Count of requests processed by a data plane.


        ### status_codes


        An object mapping a response status code to a count of requests as observed

        at a data plane.


        ### suspended_requests


        Average suspended request count at any given instant because the application

        servers were not responsive.


        ### useragent_device


        An object mapping a user agent device code to a count of requests as

        observed at a data plane.


        ### useragent_name


        An object mapping a user agent name to a count of requests as observed at a

        data plane.


        ### useragent_os


        An object mapping a user agent operating code to a count of requests as

        observed at a data plane.


        ### webcontrol_hits


        An object mapping a Web Control identifier to a count of requests as

        observed at a data plane.'
      tags:
      - Applications
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          description: Application id.
      - name: names
        in: query
        required: true
        description: 'A comma-separated list of metric names. Result arrays will include

          metric values in the same order as specified here.

          '
        schema:
          type: array
          items:
            type: string
      - $ref: '#/components/parameters/from'
        schema: {}
      - $ref: '#/components/parameters/to'
        schema: {}
      - $ref: '#/components/parameters/resolution'
        schema: {}
      - $ref: '#/components/parameters/summarize'
        schema: {}
      responses:
        '200':
          description: Metrics for the application have been returned successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
      operationId: getApplicationsByIdMetrics
      x-operation-id-source: derived
  /applications/{app_id}/webcontrols:
    get:
      summary: Read web controls
      description: Returns all web controls for an application
      tags:
      - Applications
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          description: Application id.
      - name: filter
        in: query
        schema:
          type: string
          pattern: ^$
          description: An optional filter that can be provided. An empty string asks for every web control, including deleted controls.
      - name: attributes
        in: query
        schema:
          type: string
          pattern: ^([-+][a-z0-9_]+)(,[-+][a-z0-9_]+)*$
          description: A comma-separated list of attributes to be returned for web controls. Using a prefix of + or - respectively, will add or remove an attribute from the default set
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                description: Web controls in the order of processing
                items:
                  $ref: '#/components/schemas/WebControl'
      operationId: getApplicationsByAppIdWebcontrols
      x-operation-id-source: derived
  /applications/{app_id}/webcontrols/{id}:
    get:
      summary: Read a web control
      description: Reads an application web control configuration.
      tags:
      - Applications
      parameters:
      - name: app_id
        in: path
        required: true
        schema:
          type: string
          description: Application id
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^\d+$
          description: Web control id
      - name: attributes
        in: query
        schema:
          type: string
          description: A comma-separated list of attributes to be returned for the web control. Using a prefix of + or - respectively, will add or remove an attribute from the default set
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebControl'
      operationId: getApplicationsByAppIdWebcontrolsById
      x-operation-id-source: derived
components:
  schemas:
    Server:
      type: object
      required:
      - public_address
      properties:
        public_address:
          $ref: '#/components/schemas/AddressWithPort'
          description: Public address of the server.
    PageControlActionSetRequestHeader:
      description: Set a request header before a request is sent to a backend server.
      required:
      - name
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - set-request-header
        name:
          description: The name of the header to be set
          type: string
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,100}$
        value:
          description: 'A [value template](/docs/api#value-template) evaluated to set the

            header value.

            '
          type: string
          pattern: ^[!"#$%&'()*+,\-./0-9:;<=>?@A-Z\[\\\]^_`a-z{|}~ ]{0,8190}$
      additionalProperties: false
    PageControlActionRewriteUrl:
      description: Rewrite the incoming request URL prior to serving it. The rewrite is designed to rewrite the URL path and the query parameters. If the URL scheme or the hostname is attempted to be modified the resulting behavior is unspecified.
      type: object
      required:
      - type
      - url
      properties:
        type:
          type: string
          enum:
          - rewrite-url
        url:
          type: string
          description: 'A [value template](/docs/api#value-template) expected to resolve to a valid

            URL.

            '
      additionalProperties: false
    ConditionAddressNotInSet:
      type: object
      description: Tests if requester's IP address is not in the specified address set
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - address_not_in_set
        address_set:
          $ref: '#/components/schemas/AddressSetHref'
      additionalProperties: false
    ConcurrentLimit:
      type: integer
      description: Maximum number of concurrently active requests that can be run in a load balancer before requests are put in the suspend queue. This attribute may only be set by system administrators
      minimum: 1
      maximum: 1024
    SecretHref:
      type: string
      pattern: ^/v2/secrets/[a-z0-9]+$
      description: The endpoint for the secret resource.
    TlsVersion:
      type: string
      description: Names of the versions of Transport Layer Security (TLS)
      enum:
      - TlsV1.1
      - TlsV1.2
      - TlsV1.3
    MaximumQueueTime:
      type: integer
      description: Maximum amount of time a request can spend in the suspend queue of a load balancer before it is failed with a timeout. This attribute may only be set by system administrators
      minimum: 1
    ConditionUrl:
      type: object
      description: 'A wildcard or regular expression url definition used for triggering page

        controls on requests.

        '
      anyOf:
      - type: object
        properties:
          scheme:
            type: string
            description: 'Http scheme used for matching against requests. If this field is

              not specified then both http and https will match.

              '
            pattern: ^(http|https|\*)$
          domain:
            type: string
            description: 'Wildcard domain used for matching against requests. If this field

              is not specified then all configured application domains will match.

              '
            maxLength: 255
            pattern: ^[0-9a-zA-Z\-*.]+$
          path:
            type: string
            description: 'Wildcard path used for matching against requests. If this field

              is not specified then all paths will match.

              '
            maxLength: 760
            pattern: ^[a-zA-Z0-9._\-~!$&'()*+,;=:@/%]*$
          query:
            type: string
            description: 'Wildcard query used for matching against requests. If this field

              is not specified then all query values will match.

              '
            maxLength: 760
            pattern: ^[a-zA-Z0-9._\-~!$&'()*+,;=:@/%]*$
        additionalProperties: false
      - type: object
        required:
        - regex
        properties:
          regex:
            type: string
            description: 'A regular expression that is tested against a normalized and unescaped

              unicode URL string. Capture groups for a matching expression are

              assigned to variables `$1` through `$9` and can be substituted in the

              value template for an action. Most of [ECMAScript regular expression]

              (https://262.ecma-international.org/11.0/#sec-regexp-regular-expression-objects),

              is implemented. However, some features such as lookahead and lookbehind

              are not supported and will generate validation errors if an attempt is

              made to use them. No line-begin (`^`) or line-end (`$`) assertions are

              added to a configured regular expression; if needed for correctness

              they must be written explicitly. For example, to match the host, and

              assign it to `$1`, use expression

              `://([^/]+)`.

              '
            format: regex
        additionalProperties: false
    ConditionRateLimit:
      description: True when the number of request during a duration is greater than a specified threshold.
      type: object
      required:
      - duration
      - display_unit
      - threshold
      properties:
        client_id:
          type: string
          description: 'A [value template](/docs/api#value-template) evaluated to set the client

            id

            '
          default: $(request_address)
        duration:
          type: integer
          description: The amount of time, in number of seconds, over which to accumulate the request count
          minimum: 5
        display_unit:
          $ref: '#/components/schemas/DurationDisplayUnit'
        threshold:
          description: Maximum number of requests in the given duration before the condition is triggered
          type: integer
          minimum: 1
        type:
          type: string
          enum:
          - rate_limit
      additionalProperties: false
    ConditionIsCrawler:
      type: object
      description: True if the requester's IP address is a known Web Crawler.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - is_crawler
      additionalProperties: false
    ConditionHeadersMatch:
      type: object
      description: Test to check if the list of named header values match their respective specified patterns.
      required:
      - list
      - type
      properties:
        case_sensitive:
          description: Flag for determining if the condition is case sensitive
          type: boolean
        list:
          description: Array of headers match conditions
          $ref: '#/components/schemas/ConditionHeaders'
        type:
          type: string
          enum:
          - headers_match
          - response_headers_match
      additionalProperties: false
    Substitute:
      type: object
      required:
      - contains
      - replace
      properties:
        contains:
          type: string
          description: Case sensitive text in URL or query.
          minLength: 1
          maxLength: 255
        replace:
          type: string
          description: Text that will replace the case sensitive input provided by user.
          minLength: 1
          maxLength: 255
    MergeSlashes:
      type: boolean
      description: Controls whether the server merges consecutive slashes in URLs. By default, consecutive slashes are merged into a single slash.
    Application:
      description: An application configuration and its state.
      type: object
      allOf:
      - $ref: '#/components/schemas/ApplicationIdentifier'
      - $ref: '#/components/schemas/ApplicationInitializer'
      - $ref: '#/components/schemas/ApplicationState'
      - $ref: '#/components/schemas/ApplicationConfiguration'
    ConditionAddressIsNotThreat:
      type: object
      description: True if the requester's IP address is not a known malicious source.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - address_is_not_threat
      additionalProperties: false
    PageControlAction:
      description: An array of actions to enact on the triggering of a page control.
      discriminator:
        propertyName: type
      anyOf:
      - $ref: '#/components/schemas/PageControlActionAddIPToList'
      - $ref: '#/components/schemas/PageControlActionAddLabels'
      - $ref: '#/components/schemas/PageControlActionCacheOverrides'
      - $ref: '#/components/schemas/PageControlActionContinue'
      - $ref: '#/components/schemas/PageControlActionDeny'
      - $ref: '#/components/schemas/PageControlActionDisableRum'
      - $ref: '#/components/schemas/PageControlActionDisableSessionTracking'
      - $ref: '#/components/schemas/PageControlActionDiscontinue'
      - $ref: '#/components/schemas/PageControlActionDrop'
      - $ref: '#/components/schemas/PageControlActionInjectHtml'
      - $ref: '#/components/schemas/PageControlActionRedirect'
      - $ref: '#/components/schemas/PageControlActionRedirectUsingMap'
      - $ref: '#/components/schemas/PageControlActionRewriteUrl'
      - $ref: '#/components/schemas/PageControlActionRouteForVerification'
      - $ref: '#/components/schemas/PageControlActionSetRequestTimeout'
      - $ref: '#/components/schemas/PageControlActionSetContentSecurityPolicy'
      - $ref: '#/components/schemas/PageControlActionSetAuthCookie'
      - $ref: '#/components/schemas/PageControlActionSetCookie'
      - $ref: '#/components/schemas/PageControlActionSetPagespeedOptions'
      - $ref: '#/components/schemas/PageControlActionSetRequestHeader'
      - $ref: '#/components/schemas/PageControlActionSetResponseHeader'
      - $ref: '#/components/schemas/PageControlActionServe'
      - $ref: '#/components/schemas/PageControlActionServeCaptchaChallenge'
      - $ref: '#/components/schemas/PageControlActionTerminateHttps'
      - $ref: '#/components/schemas/PageControlActionUseAlternateBackends'
      - $ref: '#/components/schemas/PageControlActionUserHasRole'
      - $ref: '#/components/schemas/PageControlActionSubstitute'
      - $ref: '#/components/schemas/PageControlActionUseServerlessFunction'
    AddressWithPort:
      description: IP address with port number(optional).
      type: string
      pattern: ^(([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])\.){3}([0-9]|[1-9][0-9]|1[0-9]{2}|2[0-4][0-9]|25[0-5])(/([0-9]|[1-2][0-9]|3[0-2]))?(:(6553[0-5]|655[0-2][0-9]|65[0-4][0-9][0-9]|6[0-4][0-9][0-9][0-9]|[1-5](\d){4}|[1-9](\d){0,3}))?$
    ConditionAuthCookieIsNotSet:
      type: object
      description: True when a specified authorization cookie is not set or is expired.
      required:
      - name
      - type
      properties:
        name:
          description: Name of the cookie to test
          type: string
          minLength: 1
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
        type:
          type: string
          enum:
          - auth_cookie_is_not_set
      additionalProperties: false
    ConditionAsnIs:
      type: object
      description: True if the ASN of a request is included in the specified list.
      required:
      - list
      - type
      properties:
        list:
          description: A list of ASNs
          type: array
          items:
            $ref: '#/components/schemas/Asn'
          minItems: 1
        type:
          type: string
          enum:
          - asn_is
      additionalProperties: false
    SearchResult:
      description: Results of a search task
      properties:
        matches:
          type: array
          items:
            description: A matched object
            properties:
              account:
                description: An account object that contains a href and all account attributes that were searched
                $ref: '#/components/schemas/Account'
              subject:
                type: object
                description: A matched object containing at a minimum an "href" attribute and any attributes that were searched
    DurationDisplayUnit:
      type: string
      description: Unit to use for displaying the time duration specified.
      enum:
      - seconds
      - minutes
      - hours
    ConditionRandom:
      type: object
      description: True if a value from a uniform random variable from 0.0 to 1.0 is less than or equal to the specified probability.
      required:
      - probability
      - type
      properties:
        probability:
          description: Probability for which condition is true
          type: number
          minimum: 0
          maximum: 1
        type:
          type: string
          enum:
          - random
      additionalProperties: false
    ConditionCountryIsNot:
      type: object
      description: True if the country of origin of a request is not in the specified list.
      required:
      - list
      - type
      properties:
        list:
          description: A list of country codes
          $ref: '#/components/schemas/CountryCodes'
        type:
          type: string
          enum:
          - country_is_not
      additionalProperties: false
    ApplicationPatch:
      $ref: '#/components/schemas/ApplicationConfiguration'
    ConditionCookieValueMatches:
      description: Test to check if the named cookie value matches the specified pattern. Cookie value pattern must be a regular expression.
      type: object
      required:
      - name
      - pattern
      - type
      properties:
        case_sensitive:
          description: Flag for determining if the condition is case sensitive
          type: boolean
        name:
          description: Name of the cookie to test
          type: string
          minLength: 1
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
        pattern:
          description: A regular expression to match with cookie value
          type: string
          minLength: 1
          maxLength: 255
          format: regex
        type:
          type: string
          enum:
          - cookie_value_matches
    Metrics:
      description: Metrics for the given specifications.
      type: object
      required:
      - from
      - to
      - resolution
      - metrics
      properties:
        from:
          $ref: '#/components/schemas/Timestamp'
          description: Start time for the metrics.
        to:
          $ref: '#/components/schemas/Timestamp'
          description: End time for the metrics.
        resolution:
          type: integer
          description: Resolution of the time series data returned.
        metrics:
          type: object
          description: Metrics returned
          additionalProperties:
            anyOf:
            - $ref: '#/components/schemas/MetricValues'
            - $ref: '#/components/schemas/MetricSummary'
            - $ref: '#/components/schemas/MultiMetrics'
    SiteCache:
      type: object
      description: A configuration for Dynamic Site Cache
      required:
      - enabled
      - rules
      properties:
        enabled:
          type: boolean
          description: When false, site cache will be turned off
        rules:
          type: array
          description: A sequence of rules for caching. Each enabled rule is evaluated in sequence, and the first whose conditions match a request will apply to that request. If none match, then no caching will be done
          items:
            $ref: '#/components/schemas/SiteCacheRule'
          minItems: 1
          uniqueItems: true
      additionalProperties: false
    MetricConfiguration:
      type: object
      required:
      - prototype
      additionalProperties: false
      properties:
        name:
          type: string
          description: Name of the metric
          minLength: 1
          maxLength: 50
          pattern: ^[a-z0-9-_]+$
        frequency:
          type: integer
          description: Frequency at which metrics are populated
          default: 60
        prototype:
          type: string
          description: A reference to the metric prototype
          pattern: ^/v2/metric-prototypes/[a-z0-9]+$
    PageControlActionUserHasRole:
      description: Limit access to accounts and applications to users belonging to the given role.
      type: object
      required:
      - type
      - roles
      properties:
        type:
          type: string
          enum:
          - user-has-role
        roles:
          type: array
          description: Users must belong to at least one of these roles
          items:
            type: string
            minLength: 1
            pattern: ^/v2/accounts/[a-z0-9]+/roles/[a-z0-9]+$
          minItems: 1
      additionalProperties: false
    ConditionCountryIs:
      type: object
      description: True if the country of origin of a request is included in the specified list.
      required:
      - list
      - type
      properties:
        list:
          description: A list of country codes
          $ref: '#/components/schemas/CountryCodes'
        type:
          type: string
          enum:
          - country_is
      additionalProperties: false
    CountryCode:
      description: Two letter country code defined as per the ISO 3166-1 standard.
      type: string
      pattern: ^[a-zA-Z]{2}$
    PageControlActionUseAlternateBackends:
      description: Use different servers than the default for matching requests. Final action
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - use-alternate-backends
        cluster:
          description: A reference to a cluster to which traffic is sent. One of cluster or servers is required
          $ref: '#/components/schemas/ClusterHref'
          default: 'null'
        cluster_required:
          description: Indicates whether this reference must be considered when enforcing cluster size constraints. Defaults to true. If explicitly set to false, the reference will be ignored during validation of minimum and maximum size updates to a cluster.
          type: boolean
        servers:
          description: A list of IP addresses to which traffic is sent. One of cluster or servers is required
          type: array
          items:
            $ref: '#/components/schemas/ApplicationServer'
          uniqueItems: true
        servers_hostname:
          description: A fully qualified domain name (FQDN) whose addresses are used to set the backend servers to which traffic should be sent
          $ref: '#/components/schemas/Hostname'
        remote_url:
          type:
          - string
          - 'null'
          description: 'A URL that modifies attributes of a request sent to a backend server. It

            influences the request URI, the use of HTTPS, the Host header, SNI, and

            the port used.


            **Scheme**


            A scheme in a URL (e.g., `http:` or `https:`) determines whether HTTPS is

            used for a backend connection. `https:` enables HTTPS. It can be omitted

            to use the scheme from a request. When a scheme is explicitly specified, a

            `terminate-https` action in the same web control has no effect.


            **Hostname**


            A hostname in a URL sets the `Host` header and SNI ([Server Name

            Indication](https://en.wikipedia.org/wiki/Server_Name_Indication)) for a

            backend request. It can be omitted along with scheme and port to use the

            hostname from a request. The wildcard host, `*` can be used when the

            request host should be used but a scheme or a port needs to be specified.


            **Port**


            Specifies an optional port number for a backend connection. A port

            specified in an application''s `servers` attribute will override the port

            determined by the scheme, but this port will override both.


            **Path**


            An optional path is prepended to the path of the incoming request to form

            the final URI for a request to a backend. For example, if the URL path is

            `/prefix` and the request path is `/page`, the backend receives a request

            for `/prefix/page`.


            ### Examples


            | Request URL              | Remote URL           | Effective URL                   | HTTPS | Port |

            |--------------------------|----------------------|---------------------------------|-------|------|

            | http://example.com/page  |                      | http://example.com/page         | no    |   80 |

            | http://example.com/page  | https://*            | https://example.com/page        | yes   |  443 |

            | https://example.com/page |                      | https://example.com/page        | yes   |  443 |

            | https://example.com/page | http://*             | http://example.com/page         | no    |   80 |

            | https://example.com/page | /prefix              | https://example.com/prefix/page | yes   |  443 |

            | https://example.com/page | //althost.com        | https://althost.com/page        | yes   |  443 |

            | https://example.com/page | //althost.com/prefix | https://althost.com/prefix/page | yes   |  443 |

            | https://example.com/page | http://althost.com   | http://althost.com/page         | no    |   80 |

            | http://example.com/page  | http://*:8080        | http://example.com:8080/page    | no    | 8080 |

            | https://example.com/page | https://*:8443       | https://example.com/page        | yes   | 8443 |

            | http://example.com/page  | //*:8443             | http://example.com/page         | no    | 8443 |

            '
          pattern: ^((https?:)?//(([\w-]{1,63}\.){1,}[\w-]{2,63}|\*)(:(6553[0-5]|655[0-2]\d|65[0-4]\d{2}|6[0-4]\d{3}|[1-5]\d{4}|[1-9]\d{0,3}))?(/([\w\.\-~!&'\(\)\*\+,;=:@\?/]|%[A-Fa-f0-9]{2})*)?|/([\w\.\-~!&'\(\)\*\+,;=:@\?/]|%[A-Fa-f0-9]{2})*)$
        relative_to:
          type:
          - string
          - 'null'
          description: 'Specifies a path prefix to be removed from the beginning of request URIs.

            This is useful for routing requests to backend services that do not expect

            the prefix.


            It is strongly recommended to use this property in conjunction with a

            condition that ensures it only applies to requests that have the specified

            prefix. Applying it to requests that have the prefix can lead to

            unpredictable behavior with the legacy load balancer.


            Prefix removal occurs before the `remote_url` is processed.


            ### Examples


            | Request Path | Relative To | Effective Path |

            |--------------|-------------|----------------|

            | /            |             | /              |

            | /base        |             | /base          |

            | /base        | /base       | /              |

            | /base/page   | /base       | /page          |

            | /page        | /base       | /page          |

            | /based       | /base       | /based         |

            '
          pattern: ^/([\w.\-~!$&'()*+,;=:@/]|%[A-Fa-f0-9]{2})*?$
        direct:
          description: 'Bypass all configured application proxies and connect directly to

            the destination. If not specified, the default is to use configured

            proxies.

            '
          type: boolean
      additionalProperties: false
    PageControlActionDisableRum:
      description: Disable real user monitoring when RUM is enabled for the application.  No beacon script for collecting RUM metrics will be injected into html responses.
      type: object
      required:
