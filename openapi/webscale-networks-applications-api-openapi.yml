        name:
          description: The name of the cookie to be set
          type: string
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
        value:
          description: The value to set for the cookie
          type: string
          pattern: ^[!#$%&'()*+\-./0-9:<=>?@A-Z\[\]^_`a-z{|}~]{0,100}$
        max_age:
          description: The maximum age of the cookie, in seconds
