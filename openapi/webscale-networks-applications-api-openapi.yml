    AccountHref:
      type: string
      description: A reference to an account
      pattern: ^/v2/accounts/[a-z0-9]+$
    WebControl:
      description: Conditionally applies a set of actions to a request based on triggering conditions that are evaluated over request attributes.
      allOf:
      - $ref: '#/components/schemas/WebControlConfiguration'
      - $ref: '#/components/schemas/WebControlIdentity'
      - $ref: '#/components/schemas/WebControlState'
    ApplicationInitializer:
      type: object
      properties:
        endpoint:
          type: string
          pattern: ^([a-zA-Z0-9][a-zA-Z0-9\-_]*\.){2,}[a-zA-Z0-9-]{2,}$
          description: The DNS endpoint for the application.
        subscriptions:
          type: array
          description: Plans that this application will be subscribed to.
          items:
            anyOf:
            - type: object
              required:
              - plan
              properties:
                plan:
                  type: string
                  description: 'A reference to a plan.

                    '
                  pattern: ^/v2/plans/[A-Za-z0-9-_]+$
              additionalProperties: false
          minItems: 1
          uniqueItems: true
    MetricValues:
      description: An array of metric values, one per resolution period
      type: array
      items:
        type: number
    FileHref:
      type: string
      pattern: ^/v2/files/[a-z0-9]+$
      description: Endpoint resource reference to a file.
    PageControlActionDrop:
      description: Drop the request. Final action
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - drop
      additionalProperties: false
    CdnControl:
      type: object
      required:
      - path_pattern
      - cache_key
      properties:
        path_pattern:
          $ref: '#/components/schemas/CdnControlPath'
        default_ttl:
          description: 'The default time-to-live (TTL), in seconds, for entries cached by this

            control for responses that do not include a `Cache-Control` header.

            '
          type: integer
          minimum: 0
          maximum: 31536000
          default: 0
        maximum_ttl:
          description: 'The maximum time-to-live (TTL), in seconds. A response whose Cache-Control

            or Expires header specifies that it may be cached for longer than this

            value will be stored in the Webscale CDN cache for no longer than

            maximum_ttl. This does not remove or modify headers in the response, and

            so user agents may still cache resources for the duration specified in the

            headers.

            '
          type: integer
          minimum: 0
          maximum: 31536000
        cache_key:
          $ref: '#/components/schemas/CdnCacheKey'
        origin_request:
          description: A configuration that determines whether headers, cookies and query parameters of the viewer request needs to be sent to the origin or not.
          $ref: '#/components/schemas/CdnOriginRequest'
        origin_request_handlers:
          type: array
          description: The handler to run for matching requests made when Webscale CDN contacts origin.
          items:
            $ref: '#/components/schemas/HandlerHref'
          maxItems: 1
        origin_response_handlers:
          type: array
          description: The handler to run for matching requests made when origin responds to Webscale CDN.
          items:
            $ref: '#/components/schemas/HandlerHref'
          maxItems: 1
    ConditionReferrerDoesNotMatch:
      type: object
