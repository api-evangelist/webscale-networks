    SiteCacheRule:
      type: object
      description: A rule for caching requests. All of the conditions for the rule must evaluate to true in order for the rule to be used.
      required:
      - conditions
      - enabled
      - ttl_sec
      properties:
        conditions:
          type: array
          description: An array of conditions. When empty, all requests match
          items:
            $ref: '#/components/schemas/SiteCacheCondition'
        enabled:
          type: boolean
          description: When false, this rule will not be used
        ttl_sec:
          type: integer
          description: The amount of time in seconds that a cached item is retained after it is initially stored
          minimum: 10
        key:
          $ref: '#/components/schemas/CacheKeyConfiguration'
        tags:
          description: A CacheTag
          $ref: '#/components/schemas/CacheTagConfiguration'
      additionalProperties: false
    ConditionUserAgentMatches:
      type: object
      description: True for a request user-agent that matches a specified regular expression
      required:
      - pattern
      - type
      properties:
        case_sensitive:
          description: Flag for determining if the condition is case sensitive
          type: boolean
        pattern:
          description: A regular expression
          type: string
          minLength: 1
          format: regex
        type:
          type: string
          enum:
          - user_agent_matches
      additionalProperties: false
    Task:
      type: object
      properties:
        href:
          type: string
          description: A reference to the task
        type:
          type: string
          description: The type of task
        target:
          type: string
          description: An object on which a referencing task operates
        parameters:
          type: object
          description: The parameters used as input to a task
        created:
          type: string
          format: date-time
          description: Time that the task was created.
        started:
          type: string
          format: date-time
          description: Time that the task was started.  This field will be null if the task has not started.
        completed:
          type: string
          format: date-time
          description: Time at which processing for a task completed, or null if not yet completed.
        updated:
          type: string
          format: date-time
          description: Time at which the task was last updated.
        state:
          type: string
          description: The current state of the task.  success and failed are final states.
          enum:
          - pending
          - running
          - success
          - failed
        description:
          type: string
          description: A description of the task
        message:
          type: string
          description: This field may contain a message regarding the current state of the task or it may be null.
        result:
          description: The result of a task.  Type is an object dependent on the task. Will not be set for tasks that do not compute results.
          anyOf:
          - type: object
          - $ref: '#/components/schemas/SearchResult'
    ApplicationConfiguration:
      type: object
      properties:
        name:
          type: string
          description: The name of the application.
          minLength: 1
          maxLength: 255
        aliases:
          type: array
          description: 'Unordered array of application host names.

            '
          items:
            $ref: '#/components/schemas/Hostname'
          minItems: 1
          uniqueItems: true
        cdn_aliases:
          type: array
          description: 'Unordered array of alaises whose requests are processed by the

            CDN if enabled by this application.

            '
          items:
            $ref: '#/components/schemas/Hostname'
          minItems: 1
          uniqueItems: true
        components:
          type: array
          description: List of resource layers that are attached to this application. Examples of such resources include EC2 or RDS instances available in an AWS cloud provider.
          items:
            $ref: '#/components/schemas/Component'
        cdn_configuration:
          type: object
          description: Configuration for the CDN distribution.
          $ref: '#/components/schemas/CdnConfiguration'
        cdn_service:
          description: A href to the cdn service configured for the application.
          type: string
          pattern: ^/v2/services/[a-z0-9]+$
        default_hostname:
          description: The default alias for an application.
          $ref: '#/components/schemas/Hostname'
        dns_service:
          description: A href to the dns service configured for the application.
          type:
          - string
          - 'null'
          pattern: ^/v2/services/[a-z0-9]+$
        servers_hostname:
          description: A fully qualified domain name (FQDN) whose addresses are used to set the backend servers to which traffic should be sent
          $ref: '#/components/schemas/Hostname'
        delivery:
          type: string
          description: The mode of delivery for an application. One of 'cdn', 'without-cdn', or 'rewrite-to-cdn'. The 'rewrite-to-cdn' mode is not recommended for new applications
          enum:
          - cdn
          - rewrite-to-cdn
          - without-cdn
        enable_rum:
          type: boolean
          description: Enable RUM for the application.
        enable_tls:
          type: boolean
          description: 'Enable TLS for the application.  The tls_configuration is required

            if true.

            '
          default: false
        tls_configuration:
          type: object
          description: TLS configuration that is applied when TLS is enabled.
          $ref: '#/components/schemas/TlsConfiguration'
        metrics:
          type: array
          description: Array of metric configurations attached for the application
          items:
            $ref: '#/components/schemas/MetricConfiguration'
          uniqueItems: true
        monitoring:
          $ref: '#/components/schemas/Monitoring'
        whitelist_href:
          $ref: '#/components/schemas/AddressSetHref'
          description: A reference to an address set. Addresses that are part of this set will always be allowed access
        blacklist_href:
          $ref: '#/components/schemas/AddressSetHref'
          description: A reference to an address set. Addresses that are part of this set will continue to have restricted access
        blacklist_user_agents:
          type:
          - string
          - 'null'
          description: A regular expression of user agents to be restricted access.
          minLength: 0
          maxLength: 5000
          format: regex
        concurrent_limit:
          $ref: '#/components/schemas/ConcurrentLimit'
        maximum_queue_time:
          $ref: '#/components/schemas/MaximumQueueTime'
        suspend_limit:
          $ref: '#/components/schemas/SuspendLimit'
        probes:
          type: array
          items:
            type: string
            format: uri
            description: A list of urls to be probed in application status checks.
        protection:
          type: string
          description: The protection mode.
          enum:
          - normal
          - maximum
        cluster:
          $ref: '#/components/schemas/ClusterHref'
          description: Application cluster.
        servers:
          type:
          - array
          - 'null'
          description: Application static servers.
          items:
            $ref: '#/components/schemas/ApplicationServer'
          minItems: 1
          uniqueItems: true
        request_timeout:
          type: integer
          description: Time for which Webscale proxy will wait for a backend server to respond. If proxy does not receive response in a specified time from the backend server, a maintenance page with status 502 Bad Gateway will be returned
          minimum: 1
          maximum: 60
          default: 30
        shields:
          type: array
          description: 'References to security groups or firewalls that are updated with the

            addresses of the data plane used by this application. Application servers

            configured to use the same security group will only be accessible by

            the Webscale service, making direct attacks impossible.

            '
          items:
            type: string
            description: 'A reference to a security group or firewall obtained through a provider

              service API call.

              '
        shields_include_whitelist:
          type: boolean
          description: 'Add the application allowlist to the addresses configured for shields.

            This should only be used when the allowlist is relatively small because

            cloud provider security groups only support a limited number of addresses.

            '
          default: false
        site_cache:
          description: A configuration for Dynamic Site Cache
          $ref: '#/components/schemas/SiteCache'
        trusted_proxies:
          description: 'Trust requests only from the referenced peers. The address from the

            `trusted_proxies_header` is accepted as the request address only from a

            trusted peer. If the array is empty the address of the peer that connects

            to the Webscale data plane is used as the request address.

            '
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/AddressSetHref'
          uniqueItems: true
        trusted_proxies_only:
          type: boolean
          description: 'Blocks traffic that does not come from a trusted proxy.

            '
          default: false
        trusted_proxies_header:
          type: string
          description: 'The name of the header from a trusted proxy that is used to obtain

            the request address. When not set, `X-Forwarded-For` is used.

            '
          minLength: 1
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
          default: X-Forwarded-For
        data_planes:
          type: array
          description: Configured data planes
          items:
            type: string
            description: A reference to the data plane.
            pattern: ^/v2/data-planes/[a-z0-9]+$
          minItems: 1
          maxItems: 1
        labels:
          type: array
          description: Array of labels that will be attached to the application.
          items:
            $ref: '#/components/schemas/Label'
        merge_slashes:
          $ref: '#/components/schemas/MergeSlashes'
        translate_path:
          $ref: '#/components/schemas/TranslatePath'
          default: preserve
        pagespeed_disallow:
          type: array
          description: 'A set of URL patterns to exclude from PageSpeed optimization. When not

            set or when it includes either the pattern `*` or `/*`, then PageSpeed is

            disabled for an application.

            '
          items:
            type: string
            pattern: (?:[\w.\-~!$&'()*+,;=:@?/]|%[A-Fa-f0-9]{2})*
        pagespeed_exclude_agents:
          type: string
          description: User agents that match this regular expression are excluded from pagespeed
        pagespeed_map_proxy_domains:
          type: array
          description: A set of domains that are integrated into the pages for this site
          items:
            type: string
            pattern: (https?://)?(?:[\w_\-]{1,63}\.){1,}[\w_\-]{2,63}(?:/(?:[\w.\-~!$&'()*+,;=:@?/]|%[A-Fa-f0-9]{2})*)?
        microsite:
          description: A reference to the file that the application will use as its default microsite.
          $ref: '#/components/schemas/FileHref'
        web_controls:
          type: array
          description: An array of specific mode web controls processed in sequence to modify the behavior of request processing
          items:
            $ref: '#/components/schemas/WebControlConfiguration'
          minItems: 0
          uniqueItems: true
        log_retention:
          type: array
          description: An array of application log retention configuration objects
          items:
            $ref: '#/components/schemas/ApplicationLogRetention'
        trusted_proxies_auth_header_name:
          type:
          - string
          - 'null'
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,100}$
          description: 'Along with `trusted_proxies_auth_header_value`, provides a means to

            authenticate a proxy downstream from the Webscale data plane. If the

            configured header and value are provided, then the downstream peer for

            a request is treated as trusted, and the request IP address is taken

            from the value of the header specified as `trusted_proxies_header`,

            or its default `X-Forwarded-For`. If the attribute

            `trusted-proxies-only` is set to true, then requests that arrive

            without a matching header value will be denied. Note that this attribute is

            ignored when `delivery` is set to `cdn`.

            '
          minLength: 1
          maxLength: 100
        trusted_proxies_auth_header_value:
          type:
          - string
          - 'null'
          pattern: ^[!"#$%&'()*+,\-./0-9:;<=>?@A-Z\[\\\]^_`a-z{|}~ ]{0,8190}$
          description: 'Along with `trusted_proxies_auth_header_name`, provides a means to

            authenticate a proxy downstream from the Webscale data plane. If the

            configured header and value are provided, then the downstream peer for

            a request is treated as trusted, and the request IP address is taken

            from the value of the header specified as `trusted_proxies_header`,

            or its default `X-Forwarded-For`. If the attribute

            `trusted-proxies-only` is set to true, then requests that arrive

            without a matching header value will be denied. Note that this attribute is

            ignored when `delivery` is set to `cdn`.

            '
          minLength: 1
          maxLength: 100
        trusted_proxies_request_id_header:
          type:
          - string
          - 'null'
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,100}$
          description: 'If a request arrives from a trusted proxy, either by matching an

            address in `trusted_proxies` or by matching the value specified by

            `trusted_proxies_auth_header_name`, then a request id for each request

            will be extracted from the value of this header, when present.

            '
          minLength: 1
          maxLength: 100
    ConditionMethodIsNot:
      type: object
      description: True if the method name of a request is not included in the specified list.
      required:
      - values
      - type
      properties:
        values:
          description: A list of method names.
          $ref: '#/components/schemas/MethodNames'
        type:
          type: string
          enum:
          - method_is_not
    ConditionAddressIsThreat:
      type: object
      description: True if the requester's IP address is a known malicious source.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - address_is_threat
      additionalProperties: false
    ConditionCookieValueDoesNotMatch:
      description: Test to check if the named cookie value does not match the specified pattern. If the specified cookie does not exist, this condition will evaluate to true. Cookie value pattern must be a regular expression.
      type: object
      required:
      - name
      - pattern
      - type
      properties:
        case_sensitive:
          description: Flag for determining if the condition is case sensitive
          type: boolean
        name:
          description: Name of the cookie to test
          type: string
          minLength: 1
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
        pattern:
          description: A regular expression to match with cookie value
          type: string
          minLength: 1
          maxLength: 255
          format: regex
        type:
          type: string
          enum:
          - cookie_value_does_not_match
    ConditionReferrerIsDefined:
      type: object
      description: True for a request for which request referrer hostname matches a hostname for this application
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - referrer_is_defined
      additionalProperties: false
    CdnConfiguration:
      type: object
      description: Configuration for the CDN of an application.
      required:
      - controls
      properties:
        controls:
          type: array
          description: 'Specifies caching and origin request behaviors for requests that match a

            pattern.


            Specifies CloudEDGE workers to activate edge functions. If

            multiple controls match for a request, the first matchis used.

            '
          items:
            $ref: '#/components/schemas/CdnControl'
        consistent_hash_type:
          type:
          - string
          - 'null'
          description: 'Specifies which characteristics of requests are used to determine

            similarity in order to repeatably route similar requests to the same cache

            instance.

            '
          enum:
          - path
          - path-query
          default: path
      additionalProperties: false
    Timestamp:
      type: string
      format: date-time
      description: An iso8601 formatted timestamp
    CacheTagConfiguration:
      type: object
      description: The configuration to populate cache tags.
      required:
      - name
      - from
      properties:
        from:
          type: string
          description: The tags are used from the request header by default.
          enum:
          - header
        name:
          description: Header names to be included in the cache tag.
          type: string
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,100}$
          minLength: 1
    NonNegativeInteger:
      type: integer
      description: An integer of value 0 or more.
      minimum: 0
    AccountConfiguration:
      type: object
      properties:
        name:
          type: string
          description: The name for the account.
        keyword:
          type: string
          description: 'Used when including an account’s name into system components like VM

            instance names or file names. If not specified during account creation,

            the keyword attribute is automatically generated by transliterating the

            name to lowercase US-ASCII and replacing any sequences of punctuation and

            spaces to a dash. For instance, the name "Éxito S.A." results in a keyword

            of `exito-s-a`. Note that the keyword will not be automatically updated if

            the account is renamed. Modifying the keyword after resources have been

            created for an account may lead to unexpected issues. It is advised to

            perform this change only with the assistance of Webscale support.

            '
        log_retention:
          type: array
          description: 'Configuration for retention of logs that are not application-related.

            '
          items:
            $ref: '#/components/schemas/AccountLogRetention'
        owner:
          type: string
          pattern: /v2/users/[a-z0-9]+
          description: An account owner.
      additionalProperties: false
    CdnCacheKey:
      type: object
      description: 'Specifies which headers, cookies, and query parameters are used as a key for

        cache entries. A request that has a cache key value shared by a request for

        which a response is cached may deliver that response.

        '
      required:
      - headers
      - cookies
      - queries
      properties:
        headers:
          description: 'Specifies how HTTP request headers are used in constructing a cache key.

            If `none`, then headers are not used. If `include-specified`, then the

            `header_names` attribute specifies which HTTP headers are used.

            '
          type: string
          enum:
          - none
          - include-specified
        header_names:
          description: 'When `headers = include-specified`, specifies which headers to include

            in a cache key.

            '
          type: array
          items:
            type: string
            pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,100}$
          uniqueItems: true
        cookies:
          description: 'Specifies how HTTP cookies are used in constructing a cache key.


            | Value             | Description           |

            | ----------------- | --------------------- |

            | none              | Cookies are not used. |

            | include-specified | Include only the specified cookies. |

            | exclude-specified | Use all cookies except those specified. |

            | all               | All cookies are used. |


            To improve caching performance, the least inclusive option that produces

            a correct result should be used.

            '
          type: string
          enum:
          - none
          - include-specified
          - exclude-specified
          - all
        cookie_names:
          description: 'When `cookies = include-specified`, specifies the names of cookies to

            include. When `cookies = exclude-specified`, specifies the names of

            cookies to exclude.

            '
          type: array
          items:
            type: string
            pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
          uniqueItems: true
        queries:
          description: 'Specifies how HTTP query parameters are used in constructing a cache key.


            | Value             | Description           |

            | ----------------- | --------------------- |

            | none              | The query is not used. |

            | include-specified | Include only the specified query parameters. |

            | exclude-specified | Use all query parameters except those specified. |

            | all               | The entire query is used. |


            To improve caching performance, the least inclusive option that produces

            a correct result should be used.

            '
          type: string
          enum:
          - none
          - all
          - include-specified
          - exclude-specified
        query_names:
          description: 'When `queries = include-specified`, specifies the names of query

            parameters to include. When `queries = exclude-specified`, specifies the

            names of query parameters to exclude.

            '
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9._\-~!$&'()*+,;=:@/%]*$
          uniqueItems: true
    PageControlActionRedirectUsingMap:
      description: Redirect the request using a url map. If the request URL is found in the url map and a redirect occurs, then this is a final action
      type: object
      required:
      - type
      - preserve_query
      - status_code
      - url_map
      properties:
        type:
          type: string
          enum:
          - redirect-using-map
        preserve_query:
          type: boolean
          description: When true, query parameters from the request are preserved in the redirect location, unless the location in the url map specifies a query separator (question mark)
        status_code:
          type: string
          description: Response status code that will be returned in a redirect response
          pattern: ^(301|302|303|305|307)$
        url_map:
          type: string
          description: A reference to a url map
          pattern: ^/v2/url-maps/[0-9a-z]+$
        case_sensitive:
          description: When false, comparisons in the source URLs will consider upper and lowercase characters equivalent.
          type: boolean
      additionalProperties: false
    ConditionUrlMatches:
      type: object
      description: True for a request URL that matches a URL pattern from a list.
      required:
      - list
      - type
      properties:
        case_sensitive:
          description: Flag for determining if the condition is case sensitive
          type: boolean
        list:
          description: Array of url objects
          $ref: '#/components/schemas/ConditionUrls'
        type:
          type: string
          enum:
          - urls
      additionalProperties: false
    HandlerHref:
      type: string
      description: A reference to the handler.
      pattern: ^/v2/handlers/[a-z0-9]+$
    AccountLogRetention:
      type: object
      additionalProperties: false
      required:
      - type
      properties:
        type:
          type: string
          description: Type of log retention
          enum:
          - events
        online_days:
          type: integer
          description: Number of online days
          minimum: 1
        archive_days:
          type: integer
          description: Number of archive days
          minimum: 1
        online_space_allowance:
          type: integer
          description: Allowance for online space
          minimum: 1
        archive_space_allowance:
          type: integer
          description: Allowance for archive space
          minimum: 1
    PageControlActionSetContentSecurityPolicy:
      description: Set a content security policy.
      required:
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - set-content-security-policy
        value:
          description: CSP action value is a hash where the key is the directive name and the value is the directive value. The directive value is usually an array of strings, but for a couple directives it is a boolean.
          type: object
      additionalProperties: false
    PageControlActionDeny:
      description: Deny the request with the given status code. Final action
      type: object
      required:
      - type
      - status_code
      - body
      properties:
        type:
          type: string
          enum:
          - deny
        status_code:
          type: string
          description: Response status code that will be returned as a result of deny action
          pattern: ^[1-5]\d\d$
        body:
          type: string
          description: The response body to send when a request is denied
      additionalProperties: false
    ConditionHeaderValueDoesNotMatch:
      description: Test to check if the header value does not match the specified pattern. If the specified header does not exist, this condition will evaluate to true. Header value pattern must be a regular expression.
      type: object
      required:
      - name
      - pattern
      - type
      properties:
        case_sensitive:
          description: Flag for determining if the condition is case sensitive
          type: boolean
        name:
          description: Name of the header to test
          type: string
          minLength: 1
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
        pattern:
          description: A regular expression to match with header value
          type: string
          minLength: 1
          maxLength: 255
          format: regex
        type:
          type: string
          enum:
          - header_value_does_not_match
    ConditionReferrerIsNotDefined:
      type: object
      description: True for a request for which request referrer hostname does not match a hostname for this application.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - referrer_is_not_defined
      additionalProperties: false
    SuspendLimit:
      type: integer
      description: Maximum number of requests that can be put in the suspend queue of a load balancer before the oldest requests are failed. This attribute may only be set by system administrators
      minimum: 1
    ClusterHref:
      type:
      - string
      - 'null'
      pattern: ^/v2/clusters/[a-z0-9]+$
      description: The endpoint for the cluster resource.
    Monitoring:
      type: string
      description: The monitoring mode. When active, the application will be monitored regularly from a separate location, in addition to passive monitoring. When passive, the error rate for the application is monitored and used to generate alerts, but if there is no regular activity to the application, then no outage will be detected.
      enum:
      - none
      - passive
      - active
    ConditionUrlDoesNotMatch:
      type: object
      description: True for a request URL that does not match any URL pattern from a list.
      required:
      - list
      - type
      properties:
        case_sensitive:
          description: Flag for determining if the condition is case sensitive
          type: boolean
        list:
          description: Array of url objects
          $ref: '#/components/schemas/ConditionUrls'
        type:
          type: string
          enum:
          - url_is_not
      additionalProperties: false
    PageControlActionInjectHtml:
      description: Inject HTML from a specified microsite file into a response document before the close of the `head` tag whenever the content type is `text/html`.
      type: object
      required:
      - type
      - file
      - path
      properties:
        type:
          type: string
          enum:
          - inject-html
        file:
          description: A reference to the file containing the snippet to be injected.
          $ref: '#/components/schemas/FileHref'
        path:
          description: 'A [value template](/docs/api#value-template) used to specify a path within

            the specified microsite.

            '
          type: string
          pattern: ^[^/]
      additionalProperties: false
    MethodName:
      description: Name of different HTTP methods.
      type: string
      minLength: 3
      maxLength: 20
      pattern: ^[A-Z\-]{3,20}$
    PageControlActionServeCaptchaChallenge:
      description: Issue a reCaptcha challenge to the user for all incoming requests unless the user has successfully completed a validation before.
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - serve-captcha-challenge
      additionalProperties: false
    ConditionUserAgentDoesNotMatch:
      type: object
      description: True for a request user-agent that does not match a specified regular expression
      required:
      - pattern
      - type
      properties:
        case_sensitive:
          description: Flag for determining if the condition is case sensitive
          type: boolean
        pattern:
          description: A regular expression
          type: string
          minLength: 1
          format: regex
        type:
          type: string
          enum:
          - user_agent_does_not_match
      additionalProperties: false
    TranslatePath:
      type: string
      description: Configuration to specify the handling of URL paths through the Webscale proxy. The default behavior is to leave the path value untouched (preserve). A value of 'unescape' would remove all escaped characters in the path and replace them with their equivalent unicode character.
      enum:
      - preserve
      - unescape
    ConditionAddressIsWhitelisted:
      type: object
      description: True if the requester's IP address is on the application whitelist.
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - address_is_whitelisted
      additionalProperties: false
    ConditionCookieIsNotSet:
      type: object
      description: True if a named cookie is not set.
      required:
      - name
      - type
      properties:
        case_sensitive:
          description: Flag for determining if the condition is case sensitive
          type: boolean
        name:
          description: Name of the cookie to test
          type: string
          minLength: 1
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
        type:
          type: string
          enum:
          - cookie_is_not_set
      additionalProperties: false
    ApplicationState:
      type: object
      required:
      - created
      - current_outage
      - state
      properties:
        cdn_ready:
          type: boolean
          description: 'True when a `delivery = cdn` has been configured and is ready.

            '
          readOnly: true
        cdn_state:
          description: 'When `delivery = rewrite-to-cdn` is used, specifies the state of the

            CDN assigned to the application.

            '
          type: string
          deprecated: true
          readOnly: true
        created:
          type: string
          format: date-time
          description: Application created time.
          readOnly: true
        current_outage:
          type: boolean
          description: 'Indicates if the application is currently experiencing an outage.

            '
          default: false
          readOnly: true
        last_outage:
          type: string
          format: date-time
          description: Last time the application had an outage.
          readOnly: true
        state:
          type: string
          description: The current state of the application.
          enum:
          - running
          - maintenance
          - entering_maintenance
          - exiting_maintenance
          - starting
          - stopped
          - stopping
          readOnly: true
    PageControlActionCacheOverrides:
      description: Update the cache-related headers of responses from backend servers.
      type: object
      required:
      - type
      - setting
      properties:
        type:
          type: string
          enum:
          - cache-overrides
        setting:
          description: Always-cache erases cache control headers and sets the cache control header to 'public' along with removing Pragma and Expires headers, allowing Webscale and browsers to cache affected responses for a default amount of time. Bypass-cache sets the cache control to disallow caching and the header is set to 'no-transform, no-cache, no-store, must-revalidate, max-age=0', ensuring that all responses are uniquely generated. Contents of the cache control header value (which will be used as is, if valid) to be used in place of the one returned from the application server when retrieving a resource
          type: string
      additionalProperties: false
    Account:
      type: object
      allOf:
      - $ref: '#/components/schemas/AccountIdentity'
      - $ref: '#/components/schemas/AccountConfiguration'
      - $ref: '#/components/schemas/AccountState'
      additionalProperties: false
    PageControlActionSetRequestTimeout:
      description: Set timeout for a request
      type: object
      required:
      - type
      - timeout
      properties:
        type:
          type: string
          enum:
          - set-request-timeout
        timeout:
          $ref: '#/components/schemas/PositiveInteger'
          description: Timeout specified in seconds for which a request can be served
      additionalProperties: false
    ConditionReferrerMatches:
      type: object
      description: True for a request for which request referrer matches a referrer pattern from a list
      required:
      - list
      - type
      properties:
        case_sensitive:
          description: Flag for determining if the condition is case sensitive
          type: boolean
        list:
          $ref: '#/components/schemas/ReferrerPatterns'
        type:
          type: string
          enum:
          - referrer_is
      additionalProperties: false
    AccountIdentity:
      type: object
      required:
      - href
      - id
      properties:
        href:
          $ref: '#/components/schemas/AccountHref'
        marketing_banners:
          type: array
          description: The marketing banners awaiting selection from the account owner.
      additionalProperties: false
    PageControlActionSetAuthCookie:
      description: Set or extend an authorization cookie. The cookie is valid for a specified duration and a domain and path if specified
      required:
      - duration
      - name
      - type
      properties:
        type:
          type: string
          enum:
          - set-auth-cookie
        name:
          description: The name of the cookie to be set
          type: string
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
        domain:
          type: string
          description: Optional domain to be sent with cookie
          maxLength: 255
          pattern: ^[0-9a-zA-Z\-*.]+$
        duration:
          type: integer
          description: The lifespan of the cookie when issued, in seconds. After the cookie is initially sent, it will be refreshed if the expiry is less than 1/2 the duration from the current time
        path:
          description: Optional path to be sent with the cookie
          type: string
          pattern: ^[!"#$%&'()*+,\-./0-9:<=>?@A-Z\[\\\]^_`a-z{|}~]{0,200}
      additionalProperties: false
    PageControlActionAddIPToList:
      description: Add IP address of the request to address set
      type: object
      required:
      - type
      - address_set
      properties:
        type:
          type: string
          enum:
          - add-address-to-set
        address_set:
          $ref: '#/components/schemas/AddressSetHref'
        ttl:
          type: integer
          description: The amount of time in seconds that an IP address will live in a set
          minimum: 300
      additionalProperties: false
    PositiveInteger:
      type: integer
      description: An integer of value 1 or more.
      minimum: 1
    CdnControlPath:
      type: string
      description: 'A pattern that is matched to a request path to determine if the control is

        used for a request. A pattern can contain wildcards that match zero or more

        characters. For example:


        - /media/*

        - /static/*.jpg

        '
      pattern: ^[a-zA-Z0-9._\-.*$/~"'@:+]*$
      maxLength: 255
      minLength: 1
    ApplicationPost:
      type: object
      required:
      - name
      - aliases
      allOf:
      - $ref: '#/components/schemas/ApplicationInitializer'
      - $ref: '#/components/schemas/ApplicationConfiguration'
    PageControlActionRedirect:
      description: Redirect the request. Final action
      type: object
      required:
      - type
      - status_code
      - location
      properties:
        type:
          type: string
          enum:
          - redirect
        status_code:
          type: string
          description: Response status code that will be returned as a result of redirection
          pattern: ^(301|302|303|305|307|308)$
        location:
          type: string
          description: 'A [value template](/docs/api#value-template) expected to resolve to a valid

            value for the [Location header](

            https://datatracker.ietf.org/doc/html/rfc7231#section-7.1.2).

            '
      additionalProperties: false
    ConditionUrls:
      type: array
      description: Array of url objects
      items:
        $ref: '#/components/schemas/ConditionUrl'
      minItems: 1
    MetricSummary:
      description: A summary value of a metric across the entire returned time range
      type: number
    PageControlActionSetResponseHeader:
      description: Set a response header before a response is returned to a web browser.
      required:
      - name
      - type
      - value
      properties:
        type:
          type: string
          enum:
          - set-response-header
        name:
          description: The name of the header to be set
          type: string
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,100}$
        value:
          description: 'A [value template](/docs/api#value-template) evaluated to set the

            header value.

            '
          type: string
          pattern: ^[!"#$%&'()*+,\-./0-9:;<=>?@A-Z\[\\\]^_`a-z{|}~ ]{0,65536}$
      additionalProperties: false
    ConditionMatchesFilter:
      type: object
      description: True if a request matches the given filter. The matches filter condition supports filtering on query parameters in the URL, and JSON and formdata in the request body.
      required:
      - filter
      - type
      - scope
      properties:
        filter:
          description: 'A [filter expression](https://control.webscale.com/docs/api) to be evaluated over the specified scopes.


            For query or formdata scopes, boolean, float and integer filter values should always be quoted strings.


            For JSON scopes, boolean, float and integer filter values should not be quoted strings.


            For nested scopes, attributes can be accessed using dot notation. For example,

            "cart.items.1" will access the second element of "items" array defined on the

            "cart" object. Arrays indexing starts at zero.

            '
          type: string
          maxLength: 1000
        type:
          type: string
          enum:
          - matches_filter
        scope:
          type: string
          enum:
          - query
          - body
    PageControlActionTerminateHttps:
      description: Use HTTP instead of HTTPS to communicate with backend servers regardless of the request protocol. This only applies to a `use-alternate-backends` action that is defined in the same web control as this action.
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - terminate-https
      additionalProperties: false
    Label:
