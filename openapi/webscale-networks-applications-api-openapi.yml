          description: The version of the web control. Versions are numbered, beginning with 1 and increase every time the web control is changed
          type: integer
        created:
          description: When this version of the web control was created
          $ref: '#/components/schemas/Timestamp'
        deleted:
          description: When the web control was deleted. Not present if it was not deleted
          $ref: '#/components/schemas/Timestamp'
        history:
          type: array
          description: All previous versions of this web control
          items:
            $ref: '#/components/schemas/WebControl'
    ConditionStatusCodeMatches:
      type: object
      description: True if the response code matches the pattern.
      required:
      - pattern
      - type
      properties:
        pattern:
          description: A regular expression to match against the response status code.
          type: string
          minLength: 1
          maxLength: 255
          format: regex
        type:
          type: string
          enum:
          - status_code_matches
      additionalProperties: false
    CdnOriginRequest:
      type: object
      required:
      - headers
      - cookies
      - queries
      properties:
        headers:
          description: Determines whether any HTTP headers in viewer requests (and if so, which headers) needs to be sent to the origin.
          type: string
          enum:
          - none
          - all
          - include-specified
        header_names:
          description: Array of header names to be included or excluded in origin request.
          type: array
          items:
            type: string
            pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,100}$
          uniqueItems: true
        cookies:
          description: Determines whether any cookies in viewer requests (and if so, which cookies) needs to be sent to the origin.
          type: string
          enum:
          - none
          - all
          - include-specified
        cookie_names:
          description: Array of cookie names to be included or excluded in origin request.
          type: array
          items:
            type: string
            pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
          uniqueItems: true
        queries:
          description: Determines whether any URL query strings in viewer requests (and if so, which query strings) needs to be sent to the origin.
          type: string
          enum:
          - none
          - all
          - include-specified
        query_names:
          description: Array of query names to be included or excluded in origin request.
          type: array
          items:
            type: string
            pattern: ^[a-zA-Z0-9._\-~!$&'()*+,;=:@/%]*$
          uniqueItems: true
    PageControlActionServe:
      description: Serve the microsite resource specified by a relative path with a specified status code. If the resource does not exist in the application's microsite, then the file index.html is used instead, which is guaranteed to exist.
      type: object
      required:
      - type
      - code
      - path
      properties:
        type:
          type: string
          enum:
          - serve
        code:
          description: The HTTP status code to return
          type: string
          pattern: ^[1-5][0-9]{2}$
        file:
          description: 'A reference to the file to be served. If omitted, the default microsite

            configured for the application will be used.

            '
          $ref: '#/components/schemas/FileHref'
        path:
          description: 'A [value template](/docs/api#value-template) used as the path within the

            specified microsite. If the path does not exist, then `index.html` is

            served.

            '
          type: string
          pattern: ^[^/]
      additionalProperties: false
    MethodNames:
      description: A list of method names.
      type: array
      items:
        $ref: '#/components/schemas/MethodName'
      minItems: 1
    PageControlActionAddLabels:
      description: Add custom labels to processed traffic. This is a non-final action.
      type: object
      required:
      - type
      - labels
      properties:
        type:
          type: string
          enum:
          - add-labels
        labels:
          type: array
          description: Array of labels that will be attached to matching traffic
          items:
            $ref: '#/components/schemas/Label'
          minItems: 1
      additionalProperties: false
    PageControlActionDisableSessionTracking:
      description: Disable Webscale session tracking. No session-tracking cookies will be added to responses.
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - disable-session-tracking
      additionalProperties: false
    TlsConfiguration:
      type: object
      properties:
        private_keys:
          description: A reference to an array of secrets containing private keys
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/SecretHref'
        certificate_chain:
          type: string
          description: 'A sequence of [PEM-encoded](https://www.rfc-editor.org/rfc/rfc7468) X.509

            certificates that are presented when the application is accessed through

            its data plane. If the certificate chain is to be presented to general

            clients then it should include a certificate chain that ends with one

            signed by a generally trusted certificate authority. Multiple server

            certificates may be included for the case where the application has

            multiple aliases, and the correct certificate will be prsesented to

            clients based on the hostname included in the request. Using `delivery =

            cdn` with multiple server certificates is not permitted.

            '
          minLength: 1
        enable_auto_tls:
          type: boolean
          description: 'When enabled Auto HTTPS will configure your application to automatically

            obtain and renew certificates from Let''s Encrypt.

            '
          default: false
        enable_force_tls:
          type: boolean
          description: 'When enabled causes a

            [Strict-Transport-Security](https://www.rfc-editor.org/rfc/rfc6797) header

            to be emitted on all responses for this application.

            '
          default: false
        enable_tls_offloading:
          type: boolean
          description: 'When enabled, traffic from the data plane to application servers will use

            the HTTP protocol without TLS. This is not recommended, and should only be

            used if some other mechanism protects the traffic from eavesdroppers, such

            as `shields` or a private network.

            '
          default: false
        enable_server_validation:
          type: boolean
          description: 'Verify that the certificates presented by application servers are valid

            for the request. Disabling this is not recommended. To avoid the

            complication of frequent expiration of application server certificates,

            consider using Origin Certificates, which do not expire as frequently as

            publicly issued certificates.

            '
          default: true
        tolerate_invalid_chain:
          type: boolean
          description: 'Tolerate certificate chain errors in certificates presented by the

            application servers. Combined with `enable_server_validation = false`,

            disables all checking of origin certificates.

            '
          default: false
        versions:
          type: array
          description: The versions of TLS that will be accepted for this application
          items:
            $ref: '#/components/schemas/TlsVersion'
          minItems: 1
          uniqueItems: true
        covered_aliases:
          type: array
          description: Covered aliases by TLS configuration for this application
          items:
            $ref: '#/components/schemas/CoveredAlias'
          readOnly: true
    ApplicationServer:
      type: object
      allOf:
