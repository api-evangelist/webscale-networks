    WebControlConfiguration:
      description: Configuration for a web control
      required:
      - actions
      - name
      properties:
        name:
          type: string
          description: Short name describing the web control.
          minLength: 1
          maxLength: 50
        description:
          type: string
          description: Optional additional description of the web control.
          minLength: 0
          maxLength: 255
        mode:
          type: string
          description: Set as 'maintenance' for maintenance mode web control.
          enum:
          - maintenance
          - request
          - response
        enabled:
          description: Enables or disables the web control.
          type: boolean
        conditions:
          type: array
          description: An array of conditions. When empty, all requests match
          items:
            $ref: '#/components/schemas/WebControlCondition'
        actions:
          type: array
          description: Actions that are applied when the web control is triggered.
          items:
            $ref: '#/components/schemas/PageControlAction'
          minItems: 0
    ConditionCookieIsSet:
      type: object
      description: True to see if a named cookie is set.
      required:
      - name
      - type
      properties:
        case_sensitive:
          description: Flag for determining if the condition is case sensitive
          type: boolean
        name:
          description: Name of the cookie to test
          type: string
          minLength: 1
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
        type:
          type: string
          enum:
          - cookie_is_set
      additionalProperties: false
    CacheKeyConfiguration:
      type: object
      description: The request attributes used to construct the cache key for requests matching this rule. Note that the request path is always included in the cache key construction.
      properties:
        browser:
          type: boolean
          description: When set to true, browser attributes used for content optimization are used in the cache key construction, ignored otherwise.
          default: false
        cookie:
          type: string
          description: The value of the specified cookie will be used to construct the cache key. If the value is null, it will be ignored.
          default: 'null'
          minLength: 1
          pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,50}$
        hostname:
          type: boolean
          description: When set to true, the host name is used in the cache key construction, ignored otherwise.
          default: false
        header:
          type:
          - array
          - 'null'
          description: 'Header names whose values are included in cache key construction.

            '
          items:
            type: string
            pattern: ^[!#$%&'*+\-.0-9A-Z^_`a-z|~]{1,100}$
          uniqueItems: true
        query:
          type: boolean
          description: When set to true, query parameters are used in the cache key construction, ignored otherwise.
          default: false
  parameters:
    summarize:
      name: summarize
      in: query
      description: 'When true specifies that a single value for each named metric is returned for

        the requested time period instead of an array divided into resolution-sized

        buckets. Mutually exlusive with `resolution`.

        '
      schema:
        type: boolean
    from:
      in: query
      name: from
      description: Select items on or after this time stamp.
      schema:
        type: string
        format: date-time
    resolution:
      name: resolution
      in: query
      description: 'Size in seconds of each bucket for which metrics data will be returned.

        Mutually exclusive with `summarize`.

        '
      schema:
        type: integer
        minimum: 5
    to:
      in: query
      name: to
      description: Select items before but not including this time stamp.
      schema:
        type: string
        format: date-time
  securitySchemes:
    access_key:
      type: http
      scheme: Bearer
      description: "An access key secret must be sent as a\n[bearer token](https://www.rfc-editor.org/rfc/rfc7235#section-5.1)\nwith each HTTP request in an `Authorization` header.  Tokens are obtained\nin one of three ways:\n\n1. Creating an access key in your\n   [user profile](https://control.webscale.com/profile).\n2. Using an access key secret created when a service user is created\n   with the [POST accounts/{id}/service-users](#post-/accounts/-id-/service-users)\n   API.\n3. Obtaining a temporary access key using an existing access key secret\n   for a specified account with the\n   [POST users/self/authorization](#post-/users/-id-/authorization) API.\n"
