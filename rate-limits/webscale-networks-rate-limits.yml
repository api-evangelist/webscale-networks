note: >-
  Webscale publishes NO rate limit for the Webscale v2 API. The 613KB OpenAPI declares no 429 response
  on any of its 151 operations, no RateLimit-* / X-RateLimit-* / Retry-After response header, and no
  quota parameter; the developer documentation has no rate-limit page for the API. An honest zero.

disambiguation: >-
  Webscale's marketing and product documentation talk about rate limiting constantly — "Basic rate
  limiting" on the Essentials plan, "Advanced rate limiting" on Scale and Enterprise, a `rate_limit`
  web-control condition, and https://docs.webscale.com/docs/how-tos/advanced/rate-limiting/. NONE of
  that is a limit on the Webscale API. It is a product FEATURE that Webscale customers configure to
  throttle traffic arriving at their own storefronts. Counting it here would credit Webscale with
  publishing API rate limits it has not published, and would mislead an agent about what happens when
  it calls the control plane hard.

