agent_readiness_blockers:
  - No operationIds in the source spec — every generated tool name would be synthesised, not provider-authored.
  - No 4xx/5xx responses declared — a tool cannot tell an agent what failure looks like.
  - No idempotency mechanism — a retried write may duplicate.
  - No rate-limit headers — an agent cannot pace itself.
  - No reversal operation or window on any of the 74 mutating operations.
