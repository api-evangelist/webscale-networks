overlay: 1.0.0
info:
  title: API Evangelist enhancements for the Webscale APIs
  version: 1.0.0
  description: 'Non-destructive enhancement overlay for the Webscale APIs OpenAPI 3.0.3 document published
    at https://control.webscale.com/docs/openapi.json (info.version 2026.273).


    It records two gaps API Evangelist measured in the published contract and the enhancement that closes
    each. It NEVER modifies the provider''s document; apply it to a copy.


    1. operationId — all 151 operations lack one. Every operationId added here is DERIVED mechanically
    from the HTTP method and path (e.g. GET /applications/{id} -> getApplicationsById). They are API Evangelist''s
    names, not Webscale''s, and MUST NOT be presented as provider-authored. Their purpose is to make the
    contract usable by code generators and MCP tool binders, which key on operationId.


    2. Error responses — the document defines components.schemas.Error ({type, description}) but no operation
    references it, and not one of the 151 operations declares a 4xx or 5xx response. This overlay wires
    the contract''s OWN error schema onto the conventional failure codes. The codes are the enhancement;
    the schema is Webscale''s.


    Not asserted: no rate-limit headers, idempotency keys, examples, or reversal semantics are added,
    because nothing in the provider''s published surface states them.'
  x-generated-by: API Evangelist enrichment pipeline
  x-generated: '2026-09-04'
  x-method: generated
  x-source: openapi/webscale-networks-webscale-apis-openapi.json
extends: openapi/webscale-networks-webscale-apis-openapi.json
